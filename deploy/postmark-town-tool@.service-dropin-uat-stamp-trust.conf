# /etc/systemd/system/postmark-town-tool@.service.d/uat-stamp-trust.conf
#
# UAT ONLY. NEVER INSTALLED ON PROD. A TEMPLATE: no ship, carry or script
# installs it. Installing it on a box is an operator's act on that box, with
# its own go (POS-1214 commissions the template, not an install).
#
# What it does (POS-1214, under Wright's 2026-11-24 14:32:35Z call on POS-1213):
# UAT signs its own mints with its own key, so a UAT stamp ledger is a
# prod-signed prefix followed by UAT-signed lines. The town's verifier takes a
# handoff (the base key through a trusted seal, UAT's public key only after it),
# and the office hands it over from ONE operator-owned, read-only file:
#
#   /etc/postmark-uat/stamp-trust.json, root-owned, mode 0644:
#   { "pubkeyPem": "<UAT's PUBLIC verification key, SPKI PEM>",
#     "afterSeal": "<the trusted seal of the copied prefix's last line, 64 hex>" }
#
# Only public material goes in it. A private key, any third field, a path
# inside the town clone, or UAT's key equal to the base key is refused by name
# (src/stamp-trust.mjs).
#
# This drop-in gives the town-tool sandbox three things, all read-only:
#   · STAMP_UAT_TRUST, the one fixed path the sandbox accepts
#     (src/stamp-trust.mjs § UAT_TRUST_PATH; any other value is a refusal);
#   · the trust file itself, at that path, inside the sandbox's /etc allowlist;
#   · src/stamp-trust.mjs, the office's one trust policy, beside the runner
#     (src/stamp-verify-pinned.mjs imports it only when the trust is asked for,
#     which is why prod's unit doesn't bind it).
# serve passes the verify tool the PATH, never the key's bytes, and never
# anything the client sent (tools/town-tool-sandbox.mjs § sandboxTrustEnv).
#
# Fails closed: a missing trust file stops the instance before serve starts
# (no "-" on the bind), and a file that's there but unusable refuses the verify,
# visibly, and runs nothing.
#
# Without this drop-in (prod), the sandbox is exactly as before: the verifier's
# environment is PATH, HOME and TOWN_TZ, and the call is unchanged byte for byte.
#
# Not covered here: the office's own processes on UAT (postmark-office, the
# ferry's mint pass, the keep tick) read STAMP_UAT_TRUST from their own
# environment, through the same policy. Setting it for them is a separate UAT
# box step.

[Service]
Environment=STAMP_UAT_TRUST=/etc/postmark-uat/stamp-trust.json
BindReadOnlyPaths=/etc/postmark-uat/stamp-trust.json
BindReadOnlyPaths=/srv/postmark-office/src/stamp-trust.mjs
