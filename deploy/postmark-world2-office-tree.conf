# ONE TREE PER BOX — the World 2.0 lanes exec the DEPLOYED office, not a second
# checkout of their own.
#
# Installed as a drop-in on every world2 unit:
#
#   /etc/systemd/system/postmark-world2-clearing.service.d/office-tree.conf
#   /etc/systemd/system/postmark-world2-notary.service.d/office-tree.conf
#   /etc/systemd/system/postmark-world2-backup.service.d/office-tree.conf
#   /etc/systemd/system/postmark-world2-ingest.service.d/office-tree.conf
#   /etc/systemd/system/postmark-world2-law-ingest.service.d/office-tree.conf
#
# The fifth is the law pen's own unit (postmark#2893, 2026-09-19). It would run
# the right tree without this drop-in, because world2-lib.sh's default is now
# /srv/postmark-office too — and it gets the drop-in anyway, because the two
# halves saying the same thing is the whole point of the section below.
#
# ── WHAT HAPPENED (2026-09-10, the arm gate) ────────────────────────────────
# The 05:45Z scheduled crossing published GREEN under release/2026-w37.9, and
# `escrow_projection` held ZERO rows after that same timer's clearing. The
# candle — postmark-world2-clearing.service — runs clearing-job.mjs out of
# /srv/world2-lab/office, a SECOND office checkout at 7926461 (2026-09-05,
# schema <= 012, no escrow ingest) that the release workflow never deploys:
# release-train.yml rsyncs the tag into /srv/postmark-office and nowhere else.
# The pen was shipped; the tree the unit holds was not moved.
#
# The notary was the same cause wearing a different symptom. Its manifest row
# declares an outcome log at /srv/world2-lab/state/canon-locks.jsonl, written by
# world2/tools/falsifier-canon-locks.mjs — which DOES NOT EXIST at 7926461 (it
# landed 2026-09-08 in 59ff9b9). Under the lab tree the nightly read cannot run,
# the log stays empty, and the row reads ALARM-outcome about the register when
# the fault was the tree.
#
# ── WHY A DROP-IN AND NOT AN EDIT TO THE UNIT ───────────────────────────────
# The same reason the swap runbook's arm is a drop-in: a file with exactly one
# job is a file whose rollback is a one-line rewrite, and the unit's own text
# stays the thing the repo ships unmodified. It is a SECOND drop-in beside any
# other the unit carries and never inside one.
#
# ── WHY NOT A SYMLINK AT /srv/world2-lab/office ─────────────────────────────
# A symlink would work and would be invisible: nothing on the box would say
# which tree the candle runs, and the next reader would find `office` beside
# `state` and `ops` and read it as a checkout. The drop-in says it in the unit,
# where `systemctl cat` shows it and where deploy/box-rollcall-manifest.json's
# tree rows can read it back.
#
# ── THE HALF THIS FILE DOES NOT FIX ─────────────────────────────────────────
# This pins which OFFICE the lane's node steps run. It does NOT pin the lane's
# own scripts: ExecStart is /srv/world2-lab/ops/world2-<lane>.sh, and that
# directory is a hand file copy of this repo's deploy/ that no deploy updates
# (DEPLOY.md § Where things live). The roll-call's `world2-ops-scripts` tree row
# is what reddens when that copy drifts; carrying it is still a person's act.
#
# ── ROLLBACK ────────────────────────────────────────────────────────────────
# Remove the four drop-ins and `systemctl daemon-reload`. The lanes then fall
# back to deploy/world2-lib.sh's default, which since this change is also
# /srv/postmark-office — so the rollback restores the OLD BEHAVIOUR only on a
# box whose ops copy predates it. That is deliberate: the two halves say the
# same thing, and drift between them is the failure this file exists about.
#
# `daemon-reload` is not a restart. All four units are Type=oneshot driven by
# timers; the next fire reads the new environment. Do NOT restart them — that
# runs a lane off-cadence, and for the clearing that means a crossing.
[Service]
Environment=WORLD2_OFFICE=/srv/postmark-office
