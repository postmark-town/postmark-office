# /etc/needrestart/conf.d/50-postmark.conf: installed by Jetto 2026-11-26 on Darko's yes (STAR-253/d).
#
# Why: on 2026-11-26 an unattended-upgrade of the Kerberos libraries (06:20:47Z) made needrestart restart Postgres by
# itself (06:20:51Z), 20 minutes after the 06:00Z settlement. The town index's ingest of that settlement's commit died on
# the dropped connection. A restart DURING a settlement or a crossing can break a sealing or a mint mid-transaction.
#
# What it does: Postgres and the office are never restarted automatically by needrestart. Security updates still
# install as before; these two services pick up new libraries at the planned restart instead
# (postmark-planned-restart.timer), in a quiet window, so they never run old libraries for long.
# Every other service keeps needrestart's normal behaviour.
#
# override_rc maps a service-name regex to 0 (never restart automatically) or 1; needrestart.conf defines the hash, and
# conf.d files are read after it, so these entries add to it.
$nrconf{override_rc}{qr(^postgresql)} = 0;
$nrconf{override_rc}{qr(^postmark-office)} = 0;
