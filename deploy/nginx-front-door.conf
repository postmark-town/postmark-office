# CORE-160 front door (Darko, 2026-11-22 22:45 EST: "1 go"; installed by Jetto 2026-11-23).
#
# 1. PACE THE PER-ROOM AND PER-CIRCLE CONVERSATION ASKS, PER ADDRESS. A bare or
#    ?closed= conversations read is served from the office's memory; ?room= and
#    ?circle= each run a record scan. A stale w48.1 tab sent 44 of them a minute
#    at 03:16Z 11-23; version B's readers peak at 11. 12r/m with burst=20 delay=3
#    (in the locations) never touches a reader and stops a runaway tab.
#    Prod sees real client addresses; dev sits behind Cloudflare, whose gate
#    makes CF-Connecting-IP trustworthy there.
#    Prod's location rewrites /api/world/... to /world/... before the limit phase
#    runs, so the map takes both spellings of the path.
map "$uri:$arg_room$arg_circle" $postmark_conv_pace_ask {
    "~^(/api)?/world/conversations:.+" 1;
    default 0;
}
map "$postmark_conv_pace_ask:$host" $postmark_conv_pace_key {
    "1:dev.postmark.town" $http_cf_connecting_ip;
    "~^1:"                $binary_remote_addr;
    default               "";
}
limit_req_zone $postmark_conv_pace_key zone=postmark_conv_pace:10m rate=12r/m;

# 2. THE SITE'S HTML REVALIDATES. With no Cache-Control the browser guessed
#    freshness from Last-Modified and kept an old page (and its old asks) for
#    hours. no-cache is not no-store: the browser keeps the page and asks first;
#    nginx answers 304 from its ETag. Only text/html gets it (an empty value
#    adds no header), so assets keep their own rules.
map $sent_http_content_type $postmark_html_cache {
    "~^text/html" "no-cache";
    default       "";
}
