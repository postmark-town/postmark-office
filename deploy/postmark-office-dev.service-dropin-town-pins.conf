# /etc/systemd/system/postmark-office-dev.service.d/town-pins.conf
# POS-994 (Wright, 2026-11-16): the dev office pins its OWN re-signed town.
# The office runs only the town code it pinned (src/town-tool.mjs); dev's ledger
# re-sign rewrites signatures inside the town's own tools, so a dev clone never
# equals the office's pins (src/town-pins/). postmark-dev-freshen.sh writes dev's
# pins every night, after the re-sign, into this folder outside the clone, and
# this names it for the dev office and every child it spawns. There is no switch
# that turns it off. The base unit is hand-installed (box-rollcall manifest, POS-522),
# so this drop-in is how its environment line is committed.
[Service]
Environment=TOWN_PINS_DIR=/srv/postmark-office-dev/town-pins-dev
