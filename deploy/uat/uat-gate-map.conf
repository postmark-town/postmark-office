# deploy/uat/uat-gate-map.conf: which requests UAT's gate lets in WITHOUT an Access JWT (CORE-165, CORE-200).
# Installed at http{} level by nginx-uat.sh, beside cf-edge-map.conf.
#
# Darko, 2026-11-28: "unblock agent access". A tester's agent reaches UAT through an MCP connector, and most
# connectors (claude.ai's, ChatGPT's) cannot send Access's service-token headers. So Cloudflare Access bypasses
# exactly these MACHINE endpoints (a separate Access application on these paths, Action Bypass: Darko's step,
# README step 6), and this map lets the same paths past the box's own JWT check.
#
# What stays behind Access, on purpose: the BROWSER half of the town's sign-in (/api/oauth/authorize,
# /api/oauth/github/callback, /api/oauth/consent, /api/oauth/human, the co-sign pages) and the whole site. The
# tester's own browser does those steps and passes Access with their GitHub sign-in, so only a uat-tester can
# mint an agent's token. Without a token the door answers 401 (no tool runs).
#
# EXACT PATHS, CASE-SENSITIVE (Truey's finding 1 on #1262). An open tail such as `/.well-known/<name>(/.*)?` let
# `/.well-known/oauth-protected-resource/..\..\oauth\authorize` past this gate: nginx matches `$uri` literally,
# and the office's `new URL()` turns the backslashes into slashes and serves authorize (the class
# src/bouncer.mjs names). So every row is one whole path the office serves (src/oauth.mjs, the discovery routes and
# the two machine-facing OAuth endpoints; src/server.mjs, /mcp). Each row is a regex anchored at both ends (`^` and
# `\z`, the true end of the string, so a trailing newline does not match either) with only literal characters
# between: a plain string key would be compared IGNORING CASE by nginx, which let `/API/MCP` through in the
# real-nginx run. A path added here is a path open to the internet: keep it in step with the Access application.
map $uri $uat_machine_path {
    default 0;
    ~^/api/mcp\z 1;
    ~^/api/oauth/register\z 1;
    ~^/api/oauth/token\z 1;
    ~^/\.well-known/oauth-protected-resource\z 1;
    ~^/\.well-known/oauth-protected-resource/api/mcp\z 1;
    ~^/\.well-known/oauth-authorization-server\z 1;
    ~^/\.well-known/oauth-authorization-server/api\z 1;
    ~^/\.well-known/openid-configuration\z 1;
    ~^/\.well-known/openid-configuration/api\z 1;
    ~^/api/\.well-known/oauth-protected-resource\z 1;
    ~^/api/\.well-known/oauth-authorization-server\z 1;
    ~^/api/\.well-known/openid-configuration\z 1;
}

# THE CLASS: a backslash anywhere in the decoded path is refused before the gate (raw or as %5C; `$uri` is
# decoded). No row above, and no row anyone adds later, can reopen the backslash walk.
map $uri $uat_uri_refuse {
    default 0;
    "~\x5c" 1;
}

# THE GATE, refusing by default (Truey's finding 4): a request passes only as a machine path ("1:…") or with a
# non-empty Access JWT header ("0:" and at least one character). Any drift in the key refuses, never opens.
map "$uat_machine_path:$http_cf_access_jwt_assertion" $uat_gate_refuse {
    default 1;
    "~^1:" 0;
    "~^0:." 0;
}
